services:
  cert-generator:
    image: alpine:latest
    container_name: cert-generator
    volumes:
      - ./nginxconf/sslcerts:/etc/nginx/ssl
    command: >
      sh -c "apk add --no-cache openssl && mkdir -p /etc/nginx/ssl && 
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 
      -keyout /etc/nginx/ssl/server.key -out /etc/nginx/ssl/server.crt 
      -subj '/C=IN/ST=Karnataka/L=Bangalore/O=Genesis/OU=IT/CN=localhost' && 
      echo 'Certificates generated successfully'"
    restart: "no"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

    networks:
      - backend_net
  # Hardened PostgreSQL
  postgres:
    build: 
      context: ./database   # directory that holds the Dockerfile
      dockerfile: Dockerfile          
    container_name: postgres-cis
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--auth-local=md5 --auth-host=md5"
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d genesis_database"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    networks:
      - backend_net 

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        # Pass from project root .env (go up 2 levels)
        - REACT_APP_HOST_IP=${HOST_IP}
        - REACT_APP_WS_PROTOCOL=wss
        - REACT_APP_WS_PATH=/webapp/api/agent/
    container_name: frontend
    environment:
      - REACT_APP_HOST_IP=${HOST_IP}
      - REACT_APP_WS_PROTOCOL=wss
      - REACT_APP_WS_PATH=/webapp/api/agent/
    env_file:
      - .env # Reference project root .env (2 levels up)
    volumes:
      - frontend_dist:/app/dist
    networks:
      - backend_net



  #  Django backend
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    command: >
      sh -c "
      echo '=== Starting Backend Initialization ===' &&
      
      echo '[1/7] Creating migrations...' &&
      python manage.py makemigrations && 

      echo '[2/7] Running database migrations...' &&
      python manage.py migrate --check || python manage.py migrate --noinput &&

      echo '[3/7] Checking django-celery-beat migrations...' &&
      python manage.py migrate django_celery_beat --check || python manage.py migrate django_celery_beat --noinput &&

      echo '[4/7] Creating superuser...' &&
      python manage.py createsuperuser --noinput || echo 'Superuser already exists' &&

      echo '[5/6] Running permissions setup...' &&
      python manage.py permissions &&
      
      echo '=== Initialization Complete. Starting Daphne server ===' &&
      exec daphne -b 0.0.0.0 -p 8001 CentralServer.asgi:application 
      "
    volumes:
      - ./src/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8001:8001" 
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend_net
  

  celery:
    build:
      context: ./src/backend  
      dockerfile: Dockerfile
    container_name: celery
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    command: celery -A CentralServer worker --pool=solo --loglevel=info
    volumes:
      - ./src/backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:  
        condition: service_started
      postgres:
        condition: service_healthy
    networks: 
      - backend_net

  celery-beat:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: celery-beat
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    command:  sh -c "
        echo ' Waiting for backend migrations to complete...' &&
        sleep 5 &&
        echo ' Starting Celery Beat scheduler...' &&
        celery -A CentralServer beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
        "
    volumes:
      - ./src/backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - backend_net

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      frontend:
        condition: service_started  
    volumes:
      - ./nginxconf/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginxconf/sslcerts:/etc/nginx/ssl
      - frontend_dist:/var/www/react/app/dist
    ports:
      - "${NGINX_PORT_HTTPS}:443"
      - "${NGINX_PORT_HTTP}:80"
    networks:
      - backend_net

volumes:
  static_files:
  postgres_data:
  postgres_logs:
  frontend_dist:

networks:
  backend_net:
    driver: bridge
