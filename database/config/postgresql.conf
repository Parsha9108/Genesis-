# =============================================================================
# PostgreSQL CIS Benchmark 1.6 Compliant Configuration
# =============================================================================

# CIS 2.1, 2.2 - Connection and Authentication Settings
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# CIS 7.1, 7.2, 7.3, 7.4 - SSL/TLS Configuration
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'
ssl_ciphers = 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_max_protocol_version = 'TLSv1.3'

# CIS 3.1 - 3.6 - Logging Configuration
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# CIS 3.7 - 3.10 - Connection and Authentication Logging
log_connections = on
log_disconnections = on
log_hostname = on
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '

# CIS 3.11 - 3.14 - Statement and Error Logging
log_statement = 'ddl'
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_statement_stats = off
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off

# CIS 6.1 - 6.8 - Authentication and Password Policies
password_encryption = 'scram-sha-256'
row_security = on
ssl_passphrase_command = ''
ssl_passphrase_command_supports_reload = off

# CIS 4.1 - Extensions and Shared Libraries
shared_preload_libraries = 'pg_stat_statements'

# Performance and Memory Settings
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 2GB
min_wal_size = 1GB

# WAL and Replication Settings
wal_level = replica
archive_mode = on
archive_command = '/bin/true'
max_wal_senders = 3
wal_keep_size = 256MB

# Checkpoint Settings
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9

# Query Planning
random_page_cost = 1.1
effective_io_concurrency = 200

# Error Reporting and Logging
log_min_messages = warning
log_min_error_statement = error
log_timezone = 'UTC'

# Locale and Formatting
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'



