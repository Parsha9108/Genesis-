# =============================================================================
# PostgreSQL CIS Benchmark 1.6 Compliant pg_hba.conf
# =============================================================================

# CIS 6.3, 6.4, 6.5 - Authentication Methods and Access Control
# TYPE  DATABASE        USER            ADDRESS                 METHOD
# Add this line for Docker networking
host    all             all             172.0.0.0/8             md5
# Local connections require password authentication
local   all             postgres                                md5
local   all             all                                     md5

# IPv4 local connections require SSL and strong authentication
hostssl all             all             127.0.0.1/32            scram-sha-256
hostssl all             all             10.0.0.0/8              scram-sha-256
hostssl all             all             172.16.0.0/12           scram-sha-256
hostssl all             all             192.168.0.0/16          scram-sha-256

# IPv6 local connections require SSL and strong authentication
hostssl all             all             ::1/128                 scram-sha-256

# Remote connections require SSL and strong authentication
hostssl all             all             0.0.0.0/0               scram-sha-256

# Explicitly reject all non-SSL connections
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

# Replication connections (if needed)
# hostssl replication     replicator      192.168.1.0/24          scram-sha-256
# pg_hba.conf - Enforce SSL and restrict access

